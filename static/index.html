<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Score Player</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Ctext x=%225%22 y=%2232%22 font-size=%2235%22%3E♪%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/static/style.css"></head><body>
<header><a class="brand" href="/">Score Player</a></header>
<main><div class="workspace"><aside class="panel import-panel">
<label for="mode">Format</label><select id="mode"><option value="auto">Auto</option><option value="staff">Notation</option><option value="tab">Tab</option></select>
<div id="tab-settings" hidden><label for="tuning">Tuning</label><select id="tuning"><option value="standard">EADGBE</option><option value="drop-d">Drop D</option><option value="dadgad">DADGAD</option></select><label for="rhythm">Rhythm</label><select id="rhythm"><option value="read">PDF</option><option value="even">Even</option></select><div id="meter-control"><label for="meter">Meter</label><select id="meter"><option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option><option value="3">6/8</option><option value="5">5/4</option><option value="6">6/4</option></select></div><div id="spacing-control" hidden><label for="step">Spacing</label><select id="step"><option value="0.25">1/16</option><option value="0.5" selected>1/8</option><option value="1">1/4</option><option value="2">1/2</option></select></div></div>
<label class="dropzone" id="dropzone" for="file" title="Upload PDF or MusicXML. Maximum 30 MB and 20 pages."><span class="upload-icon" aria-hidden="true">＋</span><input type="file" id="file" accept=".pdf,.xml,.musicxml,.mxl" aria-label="Upload PDF or MusicXML"></label>
<div id="status" class="status" role="status" aria-live="polite"></div><button id="demo" class="text-button" hidden>Demo</button>
<details id="library"><summary>Library</summary><div id="library-list"></div></details>
</aside>
<section class="panel studio"><div class="studio-top"><h2 id="title">Score</h2><p id="summary" hidden></p><button id="save-pdf" class="secondary" title="Save PDF and edits" aria-label="Save PDF and edits" hidden>💾</button><button id="reread" class="secondary" title="Read PDF again" aria-label="Read PDF again" hidden>⟳</button><button id="download" class="secondary" title="Download MIDI" aria-label="Download MIDI" disabled>↓ MIDI</button></div>
<div class="transport"><button id="play" class="primary" title="Play" aria-label="Play" disabled>▶</button><button id="stop" class="icon-button" title="Stop" aria-label="Stop" disabled>■</button><span id="clock">0:00 / 0:00</span><label class="loop" title="Loop"><input type="checkbox" id="loop" aria-label="Loop"><span aria-hidden="true">↻</span></label></div><label class="sr-only" for="seek">Position</label><input type="range" id="seek" min="0" max="1" step="0.01" value="0" disabled>
<div class="controls"><div><label for="bpm">BPM</label><input id="bpm" type="number" min="30" max="240" value="100"></div><div><label for="sound">Sound</label><select id="sound"><option value="0">Keys</option><option value="24">Guitar</option><option value="80">Tone</option></select></div><div><label for="transpose">Transpose</label><input id="transpose" type="number" min="-24" max="24" value="0" title="Semitones"></div><div><label for="part">Part</label><select id="part"><option value="all">All</option></select></div></div>
<div class="roll-wrap"><canvas id="roll" aria-label="Notes and playback position"></canvas><div id="empty"><span>♫</span></div></div>
<div id="loop-range" class="loop-range" hidden><div class="loop-track"><div id="loop-fill"></div><input id="loop-start" type="range" min="0" max="1" step="0.25" value="0" aria-label="Loop start" title="Loop start"><input id="loop-end" type="range" min="0" max="1" step="0.25" value="1" aria-label="Loop end" title="Loop end"></div><div class="loop-times"><output id="loop-from">0:00</output><output id="loop-to">0:00</output></div></div>
<div class="view-tabs" role="tablist" aria-label="Views"><button id="review-tab" role="tab" aria-selected="true">Notes</button><button id="pdf-tab" role="tab" aria-selected="false">PDF</button><span id="note-count" hidden></span></div>
<div id="review"><details id="warning-details" hidden><summary title="Recognition notes" aria-label="Recognition notes">ⓘ</summary><div id="warnings"></div></details><div class="editor-toolbar"><button id="add" class="text-button" title="Add note" aria-label="Add note" disabled>＋</button></div><div class="table-wrap"><table><thead><tr><th>Pitch</th><th title="Quarter-note beats, starting at 1">Beat</th><th title="Length in quarter-note beats">Length</th><th>Part</th><th><span class="sr-only">Remove</span></th></tr></thead><tbody id="notes"></tbody></table></div><p id="editor-empty" hidden></p></div>
<div id="pdf-view" hidden><iframe id="pdf" title="Original PDF"></iframe><p id="no-pdf" class="hint" hidden></p></div>
</section></div></main><script src="/static/loop.js"></script><script src="/static/app.js"></script></body></html>
